name: Build Android APK + AAB

# Triggers: manual dispatch OR push to main under android/
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret (run: base64 -w 0 android/android.keystore)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build APK (release, signed)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build AAB (release, signed) — for Play Store upload
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Sign APK with apksigner
        env:
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          if [ -n "$APK_UNSIGNED" ]; then
            APK_SIGNED="${APK_UNSIGNED%-unsigned.apk}-signed.apk"
            $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
              --ks android.keystore \
              --ks-key-alias android \
              --ks-pass "pass:$KP" \
              --key-pass "pass:$KAP" \
              --out "$APK_SIGNED" \
              "$APK_UNSIGNED"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alpha-fit-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: alpha-fit-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
