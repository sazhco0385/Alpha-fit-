name: Build Android APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - run: chmod +x ./gradlew

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          if [ -n "$APK" ]; then
            $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
              --ks android.keystore --ks-key-alias android \
              --ks-pass "pass:$KP" --key-pass "pass:$KAP" \
              --out "${APK%-unsigned.apk}-signed.apk" "$APK"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: alpha-fit-apk
          path: android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alpha-fit-aab
          path: android/app/build/outputs/bundle/release/*.aab
